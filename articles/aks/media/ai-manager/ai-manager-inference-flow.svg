<title id="title">AI Manager inference request flow</title>
<desc id="desc">A client sends POST /chat/completions to a namespace endpoint and authenticates with an API key or Microsoft Entra ID. AI Manager selects a deployment by deployment name, runs the request on its managed AKS cluster, and returns a completion response.</desc>
